# CommandQuest: test everything, then deploy Convex and the website.
#
#   push to `web`  -> tests -> Convex staging (robust-barracuda-45) -> Cloudflare Worker commandquest-staging
#   push to `live` -> tests -> Convex production (impressive-manatee-540)  -> Cloudflare Worker commandquest
#
# Setup (one time) is described in docs/deploy.md.
name: Web

on:
  push:
    branches: [web, live]
  workflow_dispatch:

# A newer push to the same branch makes an older test run pointless. Deploys
# opt out of cancellation below so a half-finished deploy is never killed.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  WRANGLER_VERSION: "4.149.0"

jobs:
  # Decide which jobs this push needs, from the list of changed files.
  # Any doubt (first push, manual run, API error) means "run everything".
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          all() { echo "server=true" >> "$GITHUB_OUTPUT"; echo "site=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "${{ github.event_name }}" = push ] || all
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) all;; esac
          files=$(gh api "repos/${{ github.repository }}/compare/${BEFORE}...${{ github.sha }}" \
                    --jq '.files[].filename' 2>/dev/null) || all
          # The compare API stops listing at 300 files; treat a list that long as "everything".
          [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] || all
          printf 'Changed files:\n%s\n' "$files"
          # Server: anything outside the frontend and docs can affect the Java build.
          server=false; site=false
          if printf '%s\n' "$files" | grep -qvE '^(web/|docs/|[^/]*\.md$)'; then server=true; fi
          if printf '%s\n' "$files" | grep -qE '^(web/|\.github/workflows/web\.yml$)'; then site=true; fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-latest
    steps:
      # Only web/ is needed, which skips checking out Forge's ~30k card scripts, plus
      # PhaseType.java, which tests/phases.test.ts checks the client's step ids against.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            web
            forge-game/src/main/java/forge/game/phase
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Unit tests
        run: npm test
        working-directory: web
      - name: Type-check Convex functions
        run: npx tsc -p convex --noEmit
        working-directory: web
      - name: Build (type-checks the client)
        run: npm run ${{ github.ref_name == 'live' && 'build' || 'build:staging' }}
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 7

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test forge-web-server
        run: mvn -B -f forge-web-server/reactor.xml package

  deploy:
    needs: [changes, frontend, server]
    # Run after the server job passed or was skipped (no server changes), never after a failure.
    if: >-
      !cancelled() && !failure() &&
      (github.ref_name == 'web' || github.ref_name == 'live') &&
      (needs.changes.outputs.site == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'live' && 'production' || 'staging' }}
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: web
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      # 1. Convex first, so the new site never calls functions that aren't live yet.
      #    The environment's key picks the deployment: staging (a dev-type deployment) or
      #    production. `convex deploy` needs only the key's `deployment:deploy` permission
      #    (`convex dev --once` would also need `deployment:logs:view`).
      - name: Deploy Convex
        working-directory: web
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then echo "::error::CONVEX_DEPLOY_KEY is not set for this environment"; exit 1; fi
          npx convex deploy -y

      # 2. The site, exactly as built and tested by the frontend job, as a static-assets
      #    Worker (web/wrangler.jsonc). Wrangler runs at a pinned version, not a package dependency.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: web/dist
      - name: Deploy to Cloudflare Workers
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy
          ${{ github.ref_name == 'live' && ' ' || '--env staging' }}
          --message "${{ github.sha }}"

      # 3. Smoke test: the live page answers and points at the right Convex deployment.
      - name: Smoke test
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECT: ${{ github.ref_name == 'live' && 'impressive-manatee-540' || 'robust-barracuda-45' }}
        run: |
          for i in 1 2 3 4 5 6; do
            html=$(curl -fsSL "$SITE_URL") && break
            sleep 10
          done
          [ -n "$html" ] || { echo "::error::$SITE_URL did not respond"; exit 1; }
          js=$(printf '%s' "$html" | grep -oE '/assets/[^"]+\.js' | head -1)
          curl -fsSL "$SITE_URL$js" | grep -q "$EXPECT" \
            || { echo "::error::$SITE_URL is not serving a build for $EXPECT"; exit 1; }
          echo "OK: $SITE_URL serves the $EXPECT build"
